name: CompilarPKG
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - name: Dependencias
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y curl make git python2 python3 libgmp10 libelf1 zlib1g libssl1.1 bzip2 xz-utils
          ln -sf /usr/bin/python2 /usr/bin/python
      - uses: actions/checkout@v4
      - name: BaixarToolchain
        run: |
          curl -sL https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz | tar xz -C /opt
          ls /opt/ps3dev
          echo "PS3DEV=/opt/ps3dev" >> $GITHUB_ENV
          echo "PSL1GHT=/opt/ps3dev" >> $GITHUB_ENV
          echo "/opt/ps3dev/bin" >> $GITHUB_PATH
          echo "/opt/ps3dev/ppu/bin" >> $GITHUB_PATH
      - name: ArrumarEspacos
        run: |
          python3 - <<'PY'
          import os, re, glob
          # 1 - Renomeia musicas tirando espaco, (), &, !
          for f in glob.glob("music/*.wav"):
              base = os.path.basename(f)
              novo = base.replace(" ", "").replace("(", "").replace(")", "").replace("&", "").replace("!", "").replace("'", "").replace(",", "")
              # SmackThatfeat.Eminem.wav -> SmackThat.wav
              novo = novo.replace("feat.Eminem", "").replace("feat.LilJonLudacris", "").replace("feat.LilJon", "")
              novo = novo.replace("SmackThat.wav", "SmackThat.wav")
              if novo != base:
                  print(f"Renomeando: {base} -> {novo}")
                  os.rename(f, os.path.join("music", novo))
          # 2 - Arruma o main.c pra usar nome sem espaco
          if os.path.exists("main.c"):
              txt = open("main.c").read()
              txt = txt.replace("Smack That (feat. Eminem).wav", "SmackThat.wav")
              txt = txt.replace("Losing My Religion.wav", "LosingMyReligion.wav")
              txt = txt.replace("Yeah! (feat. Lil Jon & Ludacris).wav", "Yeah.wav")
              txt = txt.replace("Yeah! (feat. Lil Jon).wav", "Yeah.wav")
              txt = txt.replace("Smack That (feat. Eminem)", "Smack That")
              txt = txt.replace("Yeah! (feat. Lil Jon & Ludacris)", "Yeah")
              open("main.c", "w").write(txt)
              print("main.c arrumado!")
          # 3 - Arruma o Makefile e sfo.xml tirando espaco do titulo
          if os.path.exists("Makefile"):
              txt = open("Makefile").read()
              txt = txt.replace("BR MUSIC", "BRMUSIC")
              txt = txt.replace('cp music/*.wav', 'cp "music"/*.wav')
              open("Makefile", "w").write(txt)
              print("Makefile arrumado!")
          if os.path.exists("sfo.xml"):
              txt = open("sfo.xml").read()
              txt = txt.replace("BR MUSIC", "BRMUSIC")
              open("sfo.xml", "w").write(txt)
              print("sfo.xml arrumado!")
          print("TUDO SEM ESPACO AGORA!")
          PY
          ls -R
      - name: GerarIcone
        run: |
          python3 - <<'PY'
          import zlib, struct
          W, H = 320, 176
          raw = b''
          for y in range(H):
              raw += b'\x00'
              for x in range(W):
                  px = (8, 30 + y // 4, 18 + y // 6)
                  if (x-90)**2 + (y-95)**2 < 900:
                      px = (30, 215, 96)
                  if (x-200)**2 + (y-80)**2 < 900:
                      px = (0, 229, 255)
                  if (x-150)**2 + (y-60)**2 < 400:
                      px = (255, 255, 255)
                  raw += bytes(px)
          def chunk(t, d):
              c = struct.pack('>I', len(d)) + t + d
              return c + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', W, H, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
          open('ICON0.PNG', 'wb').write(png)
          PY
      - name: Compilar
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: br-music-pkg
          path: brmusic.pkg